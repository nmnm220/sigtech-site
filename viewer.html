*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#25313b;background:#f1f3f4}body{display:flex;flex-direction:column}.bar{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border-bottom:1px solid #dde2e5;font-size:12px}.bar strong{display:block;margin-top:4px;font-size:14px}.bar small{font-size:10px;color:#6c7780;letter-spacing:1px}a{color:#25313b;text-decoration:none;border-bottom:1px solid #ef761b;padding:6px 0}.tools{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;background:#fff}button{border:1px solid #d3d9dd;background:#fff;color:#25313b;min-height:34px;min-width:34px;padding:7px 10px;font-size:11px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#ef761b;border-color:#ef761b}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ef761b;outline-offset:2px}#stage{flex:1;position:relative;min-height:180px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:25px;text-align:center;font-size:13px;background:#f1f3f4;z-index:2}#status[hidden]{display:none}.hint{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;font-size:10px;color:#67747d;background:#fff;border-top:1px solid #dde2e5;line-height:1.5}
